<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trackstar connection test</title>
<style>
  body{margin:0;padding:20px;font-family:-apple-system,system-ui,sans-serif;font-size:18px;
       background:#0b1020;color:#e6ebf7;line-height:1.4}
  h1{font-size:22px;margin:0 0 14px}
  input{width:100%;font-size:16px;padding:12px;border-radius:10px;border:1px solid #243056;
        background:#131a2e;color:#e6ebf7;box-sizing:border-box}
  button{width:100%;margin-top:12px;font-size:18px;padding:14px;border:0;border-radius:12px;
         background:#6ea8ff;color:#0b1020;font-weight:700}
  pre{white-space:pre-wrap;word-break:break-word;background:#131a2e;border:1px solid #243056;
      border-radius:12px;padding:14px;margin-top:14px;font-size:15px;min-height:60px}
  .ok{color:#34d399} .bad{color:#f87171}
</style>
</head>
<body>
<h1>Connection test</h1>
<label>Paste your Apps Script web app link</label>
<input id="url" placeholder="https://script.google.com/macros/s/.../exec" autocapitalize="off" autocorrect="off">
<button onclick="test()">Test connection</button>
<pre id="out">Not tested yet.</pre>
<script>
const box = document.getElementById("url");
box.value = localStorage.getItem("ts_url") || "";
function show(text, cls){
  const o = document.getElementById("out");
  o.textContent = text;
  o.className = cls || "";
}
// Loads the answer as a script tag, which browsers allow across websites.
function test(){
  const base = box.value.trim();
  if(!base){ show("Paste your link first.", "bad"); return; }
  localStorage.setItem("ts_url", base);
  const sep = base.includes("?") ? "&" : "?";
  const cb = "tsCb" + Date.now();
  let timer = null;
  function cleanup(){
    delete window[cb];
    const s = document.getElementById(cb);
    if(s) s.remove();
    clearTimeout(timer);
  }
  window[cb] = function(data){
    cleanup();
    if(data && data.ok) show("Connected. Server time: " + data.time, "ok");
    else show("Reached the script, but the answer was unexpected.", "bad");
  };
  timer = setTimeout(() => {
    cleanup();
    show("No answer after 15 seconds. Check that the link ends in /exec and that access is set to Anyone.", "bad");
  }, 15000);
  const s = document.createElement("script");
  s.id = cb;
  s.src = base + sep + "action=ping&callback=" + cb;
  s.onerror = () => { cleanup(); show("Could not load the script. Check the link.", "bad"); };
  document.body.appendChild(s);
  show("Testingâ€¦");
}
</script>
</body>
</html>
